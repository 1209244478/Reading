<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>局域网传书</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #0071e3;
    --text: #1d1d1f;
    --sub: #86868b;
    --border: #e5e5ea;
    --ok: #34c759;
    --err: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --primary: #0a84ff;
      --text: #f5f5f7;
      --sub: #98989d;
      --border: #38383a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; text-align: center; letter-spacing: .5px; }
  .sub { color: var(--sub); text-align: center; font-size: 14px; margin: 0 0 24px; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 34px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .drop:hover, .drop.over { border-color: var(--primary); background: rgba(0, 113, 227, .06); }
  .drop .icon { font-size: 40px; line-height: 1; }
  .drop h2 { font-size: 17px; margin: 14px 0 6px; }
  .drop p { color: var(--sub); font-size: 13px; margin: 0; }
  #picker { display: none; }
  .files { margin-top: 14px; }
  .file { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .file:last-child { border-bottom: none; }
  .file .row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .file .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .size { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .file .state { font-size: 12px; color: var(--sub); min-width: 58px; text-align: right; white-space: nowrap; }
  .file .state.ok { color: var(--ok); }
  .file .state.err { color: var(--err); }
  .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .15s; }
  .btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .status { text-align: center; font-size: 14px; margin-top: 14px; min-height: 20px; word-break: break-all; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .tip { color: var(--sub); font-size: 12px; text-align: center; margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>局域网传书</h1>
  <p class="sub">文件将直接传输到手机并导入书架</p>
  <div class="card">
    <div class="drop" id="drop">
      <div class="icon">&#128218;</div>
      <h2>点击选择文件，或拖拽到此处</h2>
      <p>支持 zip、pdf、epub、视频、音乐</p>
    </div>
    <input type="file" id="picker" multiple
           accept=".zip,.pdf,.epub,video/*,audio/*">
    <div class="files" id="files"></div>
    <button class="btn" id="upload" disabled>开始上传</button>
    <div class="status" id="status"></div>
  </div>
  <p class="tip">请保持手机上的接收窗口开启。<br>传输完成后即可在书架中看到导入的内容。</p>
</div>
<script>
(function () {
  var picker = document.getElementById('picker');
  var drop = document.getElementById('drop');
  var filesBox = document.getElementById('files');
  var uploadBtn = document.getElementById('upload');
  var statusEl = document.getElementById('status');
  var entries = [];
  var uploading = false;
  // 无论页面地址是否带结尾斜杠，都拼出正确的上传接口
  var uploadPath = window.location.pathname.replace(/\/+$/, '') + '/upload?name=';

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

  function setStatus(text, ok) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (ok === undefined ? '' : (ok ? ' ok' : ' err'));
  }

  function clearList() {
    entries = [];
    filesBox.innerHTML = '';
    uploadBtn.disabled = true;
  }

  function addFiles(fileList) {
    if (uploading) return;
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    clearList();
    setStatus('');
    files.forEach(function (file) {
      var item = document.createElement('div');
      item.className = 'file';
      item.innerHTML =
        '<div class="row">' +
          '<span class="name"></span>' +
          '<span class="size"></span>' +
          '<span class="state">待上传</span>' +
        '</div>' +
        '<div class="bar"><i></i></div>';
      item.querySelector('.name').textContent = file.name;
      item.querySelector('.name').title = file.name;
      item.querySelector('.size').textContent = formatSize(file.size);
      filesBox.appendChild(item);
      entries.push({
        file: file,
        bar: item.querySelector('.bar > i'),
        state: item.querySelector('.state')
      });
    });
    uploadBtn.disabled = false;
  }

  function uploadOne(entry) {
    return new Promise(function (resolve) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', uploadPath + encodeURIComponent(entry.file.name), true);
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      entry.state.textContent = '上传中';
      entry.state.className = 'state';
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.floor(e.loaded * 100 / e.total);
        entry.bar.style.width = pct + '%';
        entry.state.textContent = pct + '%';
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          entry.bar.style.width = '100%';
          entry.state.textContent = '已送达';
          entry.state.className = 'state ok';
        } else {
          entry.state.textContent = '失败';
          entry.state.className = 'state err';
          setStatus(xhr.responseText || ('上传失败（HTTP ' + xhr.status + '）'), false);
        }
        resolve();
      };
      xhr.onerror = function () {
        entry.state.textContent = '失败';
        entry.state.className = 'state err';
        setStatus('网络中断，请确认手机与电脑在同一 Wi-Fi 下', false);
        resolve();
      };
      xhr.send(entry.file);
    });
  }

  function uploadAll() {
    if (uploading || !entries.length) return;
    uploading = true;
    uploadBtn.disabled = true;
    setStatus('正在上传…');
    var index = 0;
    function next() {
      if (index >= entries.length) {
        uploading = false;
        uploadBtn.disabled = true;
        setStatus('上传已结束，请回到手机查看导入结果');
        return;
      }
      var entry = entries[index++];
      uploadOne(entry).then(next);
    }
    next();
  }

  drop.addEventListener('click', function () { picker.click(); });
  picker.addEventListener('change', function () {
    addFiles(picker.files);
    picker.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (name) {
    drop.addEventListener(name, function (e) {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (name) {
    drop.addEventListener(name, function (e) {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove('over');
    });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); });

  uploadBtn.addEventListener('click', uploadAll);
})();
</script>
</body>
</html>
